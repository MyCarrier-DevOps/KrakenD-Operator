name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "operator/**"
      - "charts/krakend-operator/**"
      - ".github/krakend-smoke/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          working-directory: operator
          args: --config ../.github/.golangci.yml --timeout 5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"
      - name: Run unit tests
        working-directory: operator
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./internal/... ./api/... ./cmd/...
          go tool cover -func=coverage.out
      - name: Run test helper unit tests
        working-directory: operator
        run: go test -race ./test/utils/...
      - name: Test the admission audit
        working-directory: operator
        run: make test-audit
      - name: Check coverage threshold
        uses: vladopajic/go-test-coverage@v2
        with:
          config: operator/.testcoverage.yml
          source-dir: ./operator

  manifests:
    name: Manifests Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"
      - name: Verify config/crd/bases is up to date
        working-directory: operator
        run: make verify-manifests

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, manifests]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"
      - name: Build binary
        working-directory: operator
        run: make build

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"
      - name: Run integration tests
        working-directory: operator
        run: go test -tags=integration -v -timeout 15m ./test/integration/

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "^1.26"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Pre-build operator image with cache
        uses: docker/build-push-action@v6
        with:
          context: operator
          load: true
          tags: ghcr.io/mycarrier-devops/krakend-operator:e2e
          cache-from: type=gha,scope=operator-image
          cache-to: type=gha,mode=max,scope=operator-image
      - name: Run e2e tests
        working-directory: operator
        env:
          SKIP_OPERATOR_BUILD: "true"
        run: go test -tags=e2e -v -timeout 30m ./test/e2e/ -ginkgo.v

  krakend-smoke:
    name: KrakenD Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check the pinned krakend binary's exit codes
        run: |
          IMG=$(sed -n 's/^ARG KRAKEND_IMAGE=//p' operator/Dockerfile)
          test -n "$IMG"
          check() {
            want=$1 fixture=$2 got=0
            docker run --rm --network=none -v "$PWD/.github/krakend-smoke:/f:ro" \
              "$IMG" check -t -n -c "/f/$fixture.json" || got=$?
            if [ "$got" -ne "$want" ]; then
              echo "::error::$fixture: want exit $want, got $got"
              exit 1
            fi
          }
          check 0 valid
          check 1 schema-error
          check 1 route-conflict
