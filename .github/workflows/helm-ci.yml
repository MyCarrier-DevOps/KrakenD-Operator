name: Helm CI

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "operator/config/rbac/**"
      - "operator/config/manager/**"
      - "operator/config/webhook/**"
      - ".github/workflows/helm-ci.yml"
      - ".github/scripts/chart-render-test.sh"

permissions:
  contents: read

jobs:
  lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Lint Helm chart
        run: helm lint charts/krakend-operator --kube-version 1.33.0

  template:
    name: Helm Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
      - name: Template Helm chart
        run: helm template test charts/krakend-operator --kube-version 1.33.0 > /dev/null
      - name: Chart render tests
        run: bash .github/scripts/chart-render-test.sh
