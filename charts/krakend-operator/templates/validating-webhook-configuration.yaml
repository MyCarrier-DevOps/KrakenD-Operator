{{- if .Values.webhooks.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "krakend-operator.fullname" . }}-validating-webhook
  labels:
    {{- include "krakend-operator.labels" . | nindent 4 }}
  {{- if .Values.webhooks.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "krakend-operator.fullname" . }}-serving-cert
  {{- end }}
# Webhooks are generated: files/webhook-manifests.yaml is copied from
# operator/config/webhook/manifests.yaml by `make manifests`. Change the
# +kubebuilder:webhook markers, not this file. The template adds only the
# service reference, the caBundle, failurePolicy from values, and the
# cert-manager annotation above.
webhooks:
{{- range (.Files.Get "files/webhook-manifests.yaml" | fromYaml).webhooks }}
  - name: {{ .name }}
    admissionReviewVersions:
      {{- toYaml .admissionReviewVersions | nindent 6 }}
    clientConfig:
      service:
        name: {{ include "krakend-operator.fullname" $ }}-webhook-service
        namespace: {{ $.Release.Namespace }}
        path: {{ .clientConfig.service.path }}
      {{- if not $.Values.webhooks.certManager.enabled }}
      caBundle: {{ include "krakend-operator.webhookCABundle" $ }}
      {{- end }}
    failurePolicy: {{ $.Values.webhooks.failurePolicy }}
    rules:
      {{- toYaml .rules | nindent 6 }}
    sideEffects: {{ .sideEffects }}
    timeoutSeconds: {{ .timeoutSeconds }}
{{- end }}
{{- end }}
