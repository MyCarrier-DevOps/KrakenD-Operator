---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "krakend-operator.fullname" . }}-manager-role
  labels:
    {{- include "krakend-operator.labels" . | nindent 4 }}
# Rules are generated: files/manager-role.yaml is copied from
# operator/config/rbac/role.yaml by `make manifests`. Change the
# +kubebuilder:rbac markers, not this file.
rules:
{{- (.Files.Get "files/manager-role.yaml" | fromYaml).rules | toYaml | nindent 0 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "krakend-operator.fullname" . }}-manager-rolebinding
  labels:
    {{- include "krakend-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "krakend-operator.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "krakend-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
