# The metrics endpoint authenticates and authorizes every scrape with a
# TokenReview and a SubjectAccessReview, so the operator creates both.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "krakend-operator.fullname" . }}-metrics-auth-role
  labels:
    {{- include "krakend-operator.labels" . | nindent 4 }}
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - authorization.k8s.io
  resources:
  - subjectaccessreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "krakend-operator.fullname" . }}-metrics-auth-rolebinding
  labels:
    {{- include "krakend-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "krakend-operator.fullname" . }}-metrics-auth-role
subjects:
- kind: ServiceAccount
  name: {{ include "krakend-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
# Bind this role to whatever scrapes the operator (for example the
# Prometheus ServiceAccount) so its requests pass the authorization check.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "krakend-operator.fullname" . }}-metrics-reader
  labels:
    {{- include "krakend-operator.labels" . | nindent 4 }}
rules:
- nonResourceURLs:
  - /metrics
  verbs:
  - get
