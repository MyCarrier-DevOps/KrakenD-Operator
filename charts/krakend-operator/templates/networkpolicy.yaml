{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "krakend-operator.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "krakend-operator.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "krakend-operator.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 12 }}
      ports:
        - port: {{ .Values.metrics.service.port }}
          protocol: TCP
    {{- end }}
    {{- if .Values.webhooks.enabled }}
    # The API server calls the webhooks and cannot be selected by labels.
    - ports:
        - port: 9443
          protocol: TCP
    {{- end }}
{{- end }}
